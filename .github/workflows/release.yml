name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml # zizmor: ignore[self-repository]

  native:
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml # zizmor: ignore[self-repository]

  release:
    needs: [test, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: rubygems
      url: https://rubygems.org/gems/protovalidate
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'
          # Not cached: a restored cache would be a way to smuggle code into the
          # artifacts this job signs and publishes.
          bundler-cache: false
      - run: bundle install
      # The precompiled gems land in pkg/ next to the source gem `rake release` builds.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true
      - run: ls -la pkg
      - name: Create GitHub release
        run: |
          tag_name="$(git describe --tags --abbrev=0)"
          gh release create "${tag_name}" --verify-tag --generate-notes --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to RubyGems
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
